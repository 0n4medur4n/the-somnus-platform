name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so PRs don't queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check (biome)
        run: pnpm run format:check

      - name: Lint (biome)
        run: pnpm run lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      # Package tests (packages/*/src/**/*.test.ts) import their sibling
      # workspace packages (e.g. @somnus/api-contracts) through each
      # package.json's "main", which points at dist/, not src/ -- so
      # those packages must be built before vitest can resolve them.
      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      - name: Test (vitest run)
        run: pnpm run test:run

      - name: Build (tsc)
        run: pnpm run build

      - name: Verify ADRs present
        run: |
          set -euo pipefail
          for f in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012; do
            test -f "docs/adr/${f}-"*.md || { echo "Missing ADR ${f}"; exit 1; }
          done
          echo "All 12 ADRs present."

  identity-service:
    name: Identity service (TiDB dev cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A dedicated, ref-independent group: this job hits a single shared
    # external TiDB Cloud dev cluster (no per-run namespace), so two PRs'
    # runs must queue rather than race -- resetTables() in the test
    # suite would otherwise let one run truncate another's in-flight data.
    # Distinct from the workflow-level concurrency group above, which
    # only cancels older runs on the SAME ref.
    concurrency:
      group: identity-service-tidb-dev
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.TIDB_DEV_DATABASE_URL }}
      DB_SSL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Consent (build plan §13 / ADR 0010) is a genuinely separate
      # logical database, but in dev/CI it lives on the same TiDB
      # cluster/user as identity's -- only the database name differs.
      # Derived here (never echoed) rather than a second GitHub
      # secret, since it's the same credential with one path segment
      # changed; production provisions a real, independent user for
      # somnus_consent (build plan §8), not this derivation.
      - name: Derive CONSENT_DATABASE_URL
        run: |
          echo "CONSENT_DATABASE_URL=$(echo "$DATABASE_URL" | sed 's#/somnus_identity#/somnus_consent#')" >> "$GITHUB_ENV"
          echo "CONSENT_DB_SSL=true" >> "$GITHUB_ENV"

      # identity-service depends on the built dist/ of these workspace
      # packages (each package.json's "main" points at dist/, not src/).
      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      # schemas/openapi/identity-service.json is a generated artifact
      # (gitignored, build plan §3.4: generated from Zod, never
      # hand-written) that test/contract/openapi.contract.test.ts reads
      # from disk -- it must exist before the test step runs.
      - name: Generate OpenAPI document
        run: pnpm --filter @somnus/identity-service generate:openapi

      # TiDB Serverless scales to zero when idle; the first query pays a
      # resume cost that intermittently exceeded even a 120s per-test
      # timeout. Resume the cluster with a retried SELECT 1 first, so the
      # suite starts warm (the cluster resume is cluster-wide, so this
      # warms the consent database on the same cluster too).
      - name: Warm up TiDB (resume the serverless cluster)
        run: pnpm --filter @somnus/identity-service exec node scripts/warmup-db.mjs

      # Includes the immutable negative-authorization suite (build plan
      # §20 Checkpoint 6.3) and enforces coverage thresholds.
      - name: Test identity-service
        run: pnpm --filter @somnus/identity-service test:coverage

  somnus-app:
    name: App SPA (build, tests, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The SPA imports @somnus/api-contracts through its built dist/.
      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      - name: Typecheck (strict)
        run: pnpm --filter @somnus/app typecheck

      # Runs the component tests (auth + forms), the no-tokens-in-storage
      # test, and the i18n completeness check (build plan §3.3: a missing
      # key fails CI), with coverage thresholds enforced.
      - name: Test SPA (vitest + coverage)
        run: pnpm --filter @somnus/app test:coverage

      - name: Build SPA (vite)
        run: pnpm --filter @somnus/app build

  edge-api:
    name: Edge API (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The Firestore emulator is a Java process (build plan §9: Firestore
      # holds edge-api's short-lived session state).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      # Pre-place the Firestore emulator JAR (~138MB) that emulators:exec
      # needs, into the cache dir where the firebase CLI looks for it.
      # We fetch it directly from Google's official storage rather than
      # via `firebase setup:emulators:firestore`, whose downloader fails
      # non-interactively on the runner. The pinned version tracks
      # firebase-tools (pinned in the root devDependencies); bump both
      # together. Cached across runs so it downloads at most once.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firestore-v1.21.0

      - name: Ensure Firestore emulator JAR present
        run: |
          set -euo pipefail
          JAR_DIR="$HOME/.cache/firebase/emulators"
          JAR="$JAR_DIR/cloud-firestore-emulator-v1.21.0.jar"
          if [ ! -f "$JAR" ]; then
            mkdir -p "$JAR_DIR"
            curl -fSL --retry 3 --retry-delay 2 -o "$JAR" \
              "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.21.0.jar"
          fi
          ls -la "$JAR"

      # firebase emulators:exec starts the Auth + Firestore emulators,
      # exports FIREBASE_AUTH_EMULATOR_HOST / FIRESTORE_EMULATOR_HOST into
      # the test process, runs the suite, and tears the emulators down.
      # The project id must match the tests' FIREBASE_PROJECT_ID
      # (somnus-dev-test) so verifyIdToken's aud/iss checks line up.
      # firebase-tools is the root devDependency installed above, so
      # `pnpm exec firebase` resolves from the workspace root.
      #
      # The wrapper echoes the error-relevant tail as a `::error::`
      # annotation on failure -- the annotations API is the only view of
      # this step available without raw-log access, and neither a
      # coverage-threshold miss nor an emulator problem produces a
      # per-test annotation on its own.
      - name: Test edge-api (against Auth + Firestore emulators)
        run: |
          set +e
          OUTPUT=$(pnpm exec firebase emulators:exec \
            --only auth,firestore \
            --project somnus-dev-test \
            --config services/somnus-edge-api/test/firebase.emulators.json \
            "pnpm --filter @somnus/edge-api test:coverage" 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            TAIL=$(echo "$OUTPUT" | grep -iE "error|fail|exception|emulator|not found|refused|timed out|cannot|ENOENT|java|coverage|threshold" | tail -25 | tr '\n' '~' | cut -c1-1500)
            echo "::error::edge-api exit ${CODE}: ${TAIL}"
          fi
          exit "$CODE"

  somnus-app-e2e:
    name: App SPA E2E (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The golden-path E2E (build plan §19: Playwright against the
    # docker-compose stack) runs the WHOLE platform together: MySQL,
    # Auth + Firestore emulators, the compiled identity + edge-api, and
    # the SPA. scripts/e2e-stack.mjs starts the services and drives
    # Playwright in es and ca.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The Firestore emulator is a Java process (build plan §9).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The MySQL 8 stand-in for TiDB (build plan §3.9) holds the two
      # logical databases; docker exec into the service to create them
      # (the image ships the mysql client; the runner may not).
      - name: Create logical databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -prootpw -e \
            "CREATE DATABASE IF NOT EXISTS somnus_identity CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; \
             CREATE DATABASE IF NOT EXISTS somnus_consent CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      # e2e-stack.mjs runs the COMPILED services (node dist/main.js).
      - name: Build services
        run: pnpm --filter @somnus/identity-service --filter @somnus/edge-api build

      # Two independent migration histories (identity + consent), run
      # from source so the .sql folders resolve (not copied to dist).
      - name: Migrate databases
        run: pnpm --filter @somnus/identity-service db:migrate

      - name: Install Playwright Chromium
        run: pnpm --filter @somnus/app exec playwright install --with-deps chromium

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firestore-v1.21.0

      - name: Ensure Firestore emulator JAR present
        run: |
          set -euo pipefail
          JAR_DIR="$HOME/.cache/firebase/emulators"
          JAR="$JAR_DIR/cloud-firestore-emulator-v1.21.0.jar"
          if [ ! -f "$JAR" ]; then
            mkdir -p "$JAR_DIR"
            curl -fSL --retry 3 --retry-delay 2 -o "$JAR" \
              "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.21.0.jar"
          fi
          ls -la "$JAR"

      # emulators:exec brings up Auth + Firestore, then e2e-stack.mjs
      # starts identity (:3001) + edge-api (:8090) and runs the golden
      # path (es + ca). The Playwright webServer serves the SPA on :5173.
      - name: E2E golden path (emulators + full stack)
        run: |
          pnpm exec firebase emulators:exec \
            --only auth,firestore \
            --project somnus-dev-test \
            --config services/somnus-edge-api/test/firebase.emulators.json \
            "node scripts/e2e-stack.mjs"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/somnus-app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  somnus-marketing:
    name: Marketing site (build, check, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The site imports @somnus/api-contracts through its built dist/.
      - name: Build shared packages
        run: pnpm --if-present -r --filter "./packages/*" run build

      - name: Astro check (typecheck)
        run: pnpm --filter @somnus/marketing check

      # Build before the tests: the link check and hreflang/meta tests
      # read the generated dist/.
      - name: Build marketing (astro)
        run: pnpm --filter @somnus/marketing build

      - name: Test marketing (i18n completeness, link check, hreflang/meta)
        run: pnpm --filter @somnus/marketing test

  deploy-hosting:
    name: Deploy frontends to dev Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-gate, somnus-app, somnus-marketing]
    # Build plan §20 Checkpoint 9.2 exit: both frontends deploy to dev
    # Hosting from CI. PRs get a preview channel; main goes live to dev.
    # Gated on the Firebase service-account secret so the pipeline stays
    # green until it is configured (see docs/runbooks/deploy-dev.md).
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: the-somnuss
    steps:
      - name: Note when credentials are absent
        if: env.FIREBASE_SA == ''
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT not set -- skipping Hosting deploy (see docs/runbooks/deploy-dev.md)."

      - name: Checkout
        if: env.FIREBASE_SA != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        if: env.FIREBASE_SA != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        if: env.FIREBASE_SA != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        if: env.FIREBASE_SA != ''
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        if: env.FIREBASE_SA != ''
        run: pnpm --if-present -r --filter "./packages/*" run build

      - name: Build both frontends
        if: env.FIREBASE_SA != ''
        run: |
          pnpm --filter @somnus/app build
          pnpm --filter @somnus/marketing build

      - name: Authenticate to Firebase
        if: env.FIREBASE_SA != ''
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy preview channel (pull request)
        if: env.FIREBASE_SA != '' && github.event_name == 'pull_request'
        run: pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.number }}" --project "$FIREBASE_PROJECT" --expires 7d --non-interactive

      - name: Deploy live to dev (push to main)
        if: env.FIREBASE_SA != '' && github.event_name == 'push'
        run: pnpm exec firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

  morpheo-service:
    name: Morpheo service (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Python clinical service (build plan §3.5): uv + Ruff + strict mypy +
    # pytest. Checkpoint 10.0 loads and validates the versioned clinical
    # artifacts; the coverage gate (pyproject) enforces >= 80%.
    defaults:
      run:
        working-directory: services/morpheo-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest (coverage gate)
        run: uv run pytest -q
