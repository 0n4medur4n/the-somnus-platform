# Promotion pipeline (build plan §20 Checkpoint 13.3, ADR 0023):
#   PR -> CI -> merge to main -> build and push the changed images.
#   A person then runs this workflow by hand to publish one service to one
#   environment. The dev GitHub environment has no required reviewers, so the
#   human action is the dispatch itself. Auth is Workload Identity Federation.

name: Deploy & Promote

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service to deploy
        required: true
        type: choice
        options:
          - somnus-edge-api
          - somnus-identity-service
          - somnus-worker
          - morpheo-service
          - somnus-report-service
      environment:
        description: Environment that receives the revision
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - production
      image_tag:
        description: Existing image tag (commit SHA). Empty builds the selected ref.
        required: false
        type: string
        default: ""

# Never cancel an in-flight promotion: a half-applied deploy is worse than a queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    name: Detect changed deployables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
      marketing: ${{ steps.detect.outputs.marketing }}
      app: ${{ steps.detect.outputs.app }}
      admin: ${{ steps.detect.outputs.admin }}
      any: ${{ steps.detect.outputs.any }}
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # github.event.before is empty on a manual run, so the diff below
            # would otherwise select every service. The person named one.
            case "${{ inputs.service }}" in
              somnus-edge-api|somnus-identity-service|somnus-worker|morpheo-service|somnus-report-service) ;;
              *) echo "unknown service"; exit 1 ;;
            esac
            if [ -n "${{ inputs.image_tag }}" ] && ! printf '%s' "${{ inputs.image_tag }}" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
              echo "image_tag must be a hex commit SHA"
              exit 1
            fi
            services=("${{ inputs.service }}")
            marketing=false
            app=false
            admin=false
          else
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # No reliable base (first push or force-push): rebuild all.
            changed="ALL"
          else
            changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          fi
          echo "changed paths:"; echo "$changed"

          is_all() { [ "$changed" = "ALL" ]; }
          touched() { is_all && return 0; echo "$changed" | grep -qE "$1"; }

          # A change to shared TS packages or the lockfile can affect every TS
          # deployable; a change to the cross-language JSON-schema artifacts can
          # affect the Python services. Conservative on purpose: over-deploying is
          # a redundant no-op, under-deploying ships stale code.
          shared_ts=false; { is_all || echo "$changed" | grep -qE '^(packages/|pnpm-lock\.yaml|package\.json)$|^packages/'; } && shared_ts=true
          shared_py=false; { is_all || echo "$changed" | grep -qE '^schemas/json-schema/'; } && shared_py=true

          services=()
          { $shared_ts || touched '^services/somnus-edge-api/'; }        && services+=("somnus-edge-api")
          { $shared_ts || touched '^services/somnus-identity-service/'; } && services+=("somnus-identity-service")
          { $shared_ts || touched '^services/somnus-worker/'; }           && services+=("somnus-worker")
          { $shared_py || touched '^services/morpheo-service/'; }         && services+=("morpheo-service")
          { $shared_py || touched '^services/somnus-report-service/'; }   && services+=("somnus-report-service")

          marketing=false; { $shared_ts || touched '^apps/somnus-marketing/'; } && marketing=true
          app=false;       { $shared_ts || touched '^apps/somnus-app/|^scripts/check-hosting-bundle\.|^firebase\.json$|^\.github/workflows/deploy-environment\.yml$'; } && app=true
          # The admin console is a third static frontend on its own Hosting site
          # with its own deploy cadence (Addendum A §A2.1), so it carries its own
          # flag instead of riding on the app's. `check-hosting-bundle` is
          # deliberately absent here: that guard is wired as a predeploy on the
          # `app` target only, because it requires the hosting-config.json that
          # only the SPA's hosting-mode build emits (see promotion-pipeline.md).
          admin=false;     { $shared_ts || touched '^apps/somnus-admin/|^firebase\.json$|^\.github/workflows/deploy-environment\.yml$'; } && admin=true
          fi

          services_json="$(jq -cn '$ARGS.positional' --args ${services[@]+"${services[@]}"})"
          any=false
          if [ "$services_json" != "[]" ] || [ "$marketing" = true ] || [ "$app" = true ] || [ "$admin" = true ]; then any=true; fi

          # Until the shared artifacts registry is configured (repo variable
          # ARTIFACTS_PROJECT_ID), the pipeline no-ops cleanly instead of failing
          # on missing credentials -- same pattern as ci.yml's Hosting deploy.
          if [ -n "${{ vars.ARTIFACTS_PROJECT_ID }}" ]; then
            configured=true
          else
            configured=false
            echo "::notice::Promotion pipeline not configured yet (ARTIFACTS_PROJECT_ID unset). Skipping build/deploy. See docs/runbooks/promotion-pipeline.md."
          fi

          echo "services=$services_json"   >> "$GITHUB_OUTPUT"
          echo "marketing=$marketing"       >> "$GITHUB_OUTPUT"
          echo "app=$app"                   >> "$GITHUB_OUTPUT"
          echo "admin=$admin"               >> "$GITHUB_OUTPUT"
          echo "any=$any"                   >> "$GITHUB_OUTPUT"
          echo "configured=$configured"     >> "$GITHUB_OUTPUT"
          echo "summary -> services=$services_json marketing=$marketing app=$app admin=$admin any=$any configured=$configured"

  build-push:
    name: Build + push ${{ matrix.service }}
    needs: detect
    if: ${{ needs.detect.outputs.configured == 'true' && needs.detect.outputs.services != '[]' && (github.event_name != 'workflow_dispatch' || inputs.image_tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      REGION: europe-west3
      AR_REPOSITORY: somnus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the private clinical artifacts
        if: matrix.service == 'morpheo-service'
        uses: ./.github/actions/fetch-clinical
        with:
          deploy-key: ${{ secrets.CLINICAL_DEPLOY_KEY }}

      # Build-time auth: a repo-level provider + a build service account with
      # write access to the shared artifacts registry only.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.BUILD_WIF_PROVIDER }}
          service_account: ${{ secrets.BUILD_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.ARTIFACTS_REGION }}-docker.pkg.dev" --quiet

      - name: Build + push image (tagged with the commit SHA)
        run: |
          set -euo pipefail
          image="${{ vars.ARTIFACTS_REGION }}-docker.pkg.dev/${{ vars.ARTIFACTS_PROJECT_ID }}/${AR_REPOSITORY}/${{ matrix.service }}:${{ github.sha }}"
          docker build -f "services/${{ matrix.service }}/Dockerfile" -t "$image" .
          docker push "$image"

  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
    needs: [detect, build-push]
    # A merge builds and pushes. Publishing a revision is a separate human
    # action: the dev environment has no required reviewers, so the dispatch
    # is the gate. One run deploys one service to one environment.
    if: ${{ github.event_name == 'workflow_dispatch' && always() && needs.detect.outputs.configured == 'true' && needs.detect.result == 'success' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      services: ${{ needs.detect.outputs.services }}
      marketing: false
      app: false
      admin: false
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
    secrets: inherit
