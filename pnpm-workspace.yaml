packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
minimumReleaseAge: 0
allowBuilds:
  esbuild: true
  '@swc/core': true
  protobufjs: true
  # swagger-ui-dist's telemetry beacon (scarf.sh) -- denied, not required
  # for swagger-ui-dist to function, and this is a privacy-sensitive
  # healthcare platform (build plan §15/§21).
  '@scarf/scarf': false
  # @firebase/util's postinstall only writes a client-webapp auto-init
  # config when FIREBASE_WEBAPP_CONFIG is set -- irrelevant to server-side
  # firebase-admin (edge-api never sets it), and a no-op otherwise. Denied.
  '@firebase/util': false
  # re2 is a native RE2 regex binding pulled in transitively by
  # firebase-tools (the dev/CI-only Firebase CLI). Its install script
  # fetches a prebuilt binary (falling back to a node-gyp build), which
  # firebase-tools needs to run. Allowed so a fresh install doesn't fail
  # ERR_PNPM_IGNORED_BUILDS on CI.
  re2: true
